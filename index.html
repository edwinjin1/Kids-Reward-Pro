<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA / 移动端沉浸式设置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#fbf8f1">
    
    <title>宝贝日常记分板</title>
    <style>
        :root {
            /* 莫兰迪主题色 */
            --bg-page: #fbf8f1;
            --bg-dashboard: #857e76;
            --color-sister: #d5a5a5;
            --color-brother: #91a891;
            --bg-task: #f2ebd9;
            --badge-task: #c48787;
            --bg-reward: #e8eadb;
            --badge-reward: #769a9a;
            --btn-blue: #88b5c4;
            --text-dark: #5c5c5c;
            --card-border: #e0e0e0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
        }

        .main-title {
            text-align: center;
            color: #7b6d65;
            font-size: 26px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .loading-tip {
            text-align: center;
            color: var(--btn-blue);
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
            font-size: 14px;
        }

        /* 顶部积分面板区域 */
        .dashboard-wrapper { margin-bottom: 40px; }
        
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: -15px;
            position: relative;
            z-index: 2;
        }
        
        .tab {
            width: 150px;
            text-align: center;
            padding: 12px 0 25px 0;
            border-radius: 20px 20px 0 0;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            color: white;
            transition: opacity 0.3s;
            opacity: 0.6;
        }
        .tab-sister { background-color: var(--color-sister); }
        .tab-brother { background-color: var(--color-brother); }
        .tab.active { opacity: 1; transform: translateY(5px); }

        .dashboard {
            background-color: var(--bg-dashboard);
            border-radius: 25px;
            padding: 30px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 3;
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 70px;
            height: 70px;
            background: #e6dfd5;
            border-radius: 50%;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .score-card {
            background: white;
            border-radius: 15px;
            padding: 15px 40px;
            text-align: center;
            color: var(--text-dark);
        }
        .score-label { font-size: 14px; font-weight: bold; color: #888; }
        .score-value {
            font-size: 48px;
            font-weight: 900;
            color: #79a6d2;
            margin-top: 5px;
            text-shadow: 1px 1px 0px #eee;
        }
        .score-value span { font-size: 20px; color: #79a6d2; margin-left: 5px; }

        .progress-section { width: 30%; font-size: 14px; }
        .progress-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .progress-bar-bg { background: #6b645d; border-radius: 10px; height: 12px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar-fill { background: #96b4a3; height: 100%; width: 65%; border-radius: 10px; transition: width 0.5s ease-out; }

        /* 任务与奖励区域 */
        .actions-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-box {
            flex: 1;
            border-radius: 20px;
            padding: 30px 20px 20px;
            position: relative;
            margin-top: 15px;
        }
        .task-box { background-color: var(--bg-task); }
        .reward-box { background-color: var(--bg-reward); }

        .box-badge {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 30px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .badge-task { background-color: var(--badge-task); }
        .badge-reward { background-color: var(--badge-reward); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card:active { transform: scale(0.95); }
        
        .task-box .card { border-color: #d1bba4; }
        .reward-box .card { border-color: #b5c7c7; }

        .card-icon { font-size: 32px; }
        .card-name { font-size: 13px; font-weight: bold; line-height: 1.2; }
        .card-points { font-size: 12px; font-weight: bold; }
        
        .task-box .card-points { color: #8a6a4a; }
        .reward-box .card-points { color: #5f7a7a; }

        /* 底部设置按钮 */
        .bottom-actions { display: flex; justify-content: center; margin-top: 20px; }
        .settings-btn {
            background-color: var(--btn-blue);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(136, 181, 196, 0.4);
            transition: opacity 0.2s;
        }
        .settings-btn:active { opacity: 0.8; transform: scale(0.98); }

        /* 模态框 (后台设置) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
            padding: 15px;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            padding: 25px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .admin-title { text-align: center; color: var(--btn-blue); margin-top: 0; }
        .admin-section { background: var(--bg-page); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .admin-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .admin-row input {
            padding: 10px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 14px;
        }
        .input-icon { width: 60px; text-align: center; font-weight: bold; }
        .input-name { flex: 1; }
        .input-points { width: 80px; }
        .btn-add { background: var(--btn-blue); color: white; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .btn-update { background: #e0b084; color: white; border: none; border-radius: 8px; padding: 10px 15px; cursor: pointer; }
        
        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px dashed #ccc; font-size: 14px;
        }
        .btn-del { background: #e07a7a; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
        .btn-edit { background: var(--btn-blue); color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; margin-right: 5px; }
        .btn-close { width: 100%; padding: 14px; background: #96b4a3; color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        /* 行内编辑模式样式 */
        .edit-mode { display: flex; gap: 8px; align-items: center; width: 100%; }
        .edit-input-icon { width: 50px; padding: 8px; border: 1px solid var(--btn-blue); border-radius: 6px; text-align: center; }
        .edit-input-name { flex: 1; padding: 8px; border: 1px solid var(--btn-blue); border-radius: 6px; }
        .edit-input-points { width: 60px; padding: 8px; border: 1px solid var(--btn-blue); border-radius: 6px; text-align: center; }

        /* ================= 移动端专项优化 ================= */
        @media(max-width: 650px) {
            body { padding: 10px; }
            .app-container { padding: 20px 15px; border-radius: 15px; }
            .main-title { font-size: 22px; margin-bottom: 20px; }
            
            .tabs { margin-bottom: -10px; }
            .tab { width: 45%; padding: 10px 0 20px 0; font-size: 16px; border-radius: 15px 15px 0 0; }
            
            .dashboard { 
                flex-direction: column; 
                padding: 20px 15px; 
                gap: 15px; 
                border-radius: 20px;
            }
            .score-card { width: 100%; padding: 15px 20px; }
            .score-value { font-size: 42px; }
            .progress-section { width: 100%; }
            
            .actions-container { flex-direction: column; margin-bottom: 20px; }
            .action-box { padding: 30px 15px 15px; margin-top: 25px; }
            .box-badge { font-size: 14px; padding: 6px 25px; top: -16px; }
            
            .admin-row { flex-wrap: wrap; }
            .admin-row .input-icon { width: 60px; }
            .admin-row .input-name { flex: 1 1 calc(100% - 70px); }
            .admin-row .input-points { width: calc(100% - 100px); }
            .btn-add, .btn-update { flex: 1; text-align: center; }
            
            .edit-mode { flex-wrap: wrap; }
            .edit-mode .edit-input-name { min-width: 120px; flex: 1 1 auto; }
            .edit-mode > div { width: 100%; display: flex; justify-content: flex-end; margin-top: 5px; }
            
            .settings-btn { width: 100%; padding: 15px; font-size: 18px; border-radius: 15px; }
            .modal-content { padding: 20px 15px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="main-title">宝贝日常记分板 ✨</div>
    <div id="loadingTip" class="loading-tip">正在同步云端数据... ☁️</div>

    <div class="dashboard-wrapper">
        <div class="tabs">
            <div class="tab tab-sister active" onclick="window.switchKid('姐姐')">姐姐</div>
            <div class="tab tab-brother" onclick="window.switchKid('弟弟')">弟弟</div>
        </div>
        
        <div class="dashboard">
            <div class="profile">
                <div class="avatar" id="kidAvatar">🦄</div>
                <div class="name" id="kidName" style="font-weight:bold;">姐姐</div>
            </div>
            
            <div class="score-card">
                <div class="score-label">累计积分</div>
                <div class="score-value" id="currentScore">0<span>分</span></div>
            </div>
            
            <div class="progress-section">
                <div class="progress-row">
                    <span>今日成就</span>
                    <span id="todayScoreText">0分</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="todayProgressBar" style="width: 0%;"></div>
                </div>
                <div class="progress-row">
                    <span>每日目标</span>
                    <span>100积分</span>
                </div>
            </div>
        </div>
    </div>

    <div class="actions-container">
        <!-- 任务区 -->
        <div class="action-box task-box">
            <div class="box-badge badge-task">🌟 完成任务</div>
            <div class="grid" id="taskList"></div>
        </div>
        
        <!-- 奖励区 -->
        <div class="action-box reward-box">
            <div class="box-badge badge-reward">🎁 兑换奖励</div>
            <div class="grid" id="rewardList"></div>
        </div>
    </div>

    <div class="bottom-actions">
        <button class="settings-btn" onclick="window.openSettings()">前往后台设置</button>
    </div>
</div>

<!-- 后台设置弹窗 -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h2 class="admin-title">后台设置 ⚙️</h2>

        <div class="admin-section" style="background-color: #f0e6dc;">
            <h3 style="margin-top:0; color:#ab8e71;">积分管理 (直接修改总分)</h3>
            <div class="admin-row">
                <span class="input-icon">🦄 姐姐</span>
                <input type="number" id="editSisterScore" class="input-name" placeholder="输入新分数">
                <button class="btn-update" onclick="window.updateManualScore('姐姐')">修改</button>
            </div>
            <div class="admin-row">
                <span class="input-icon">🦖 弟弟</span>
                <input type="number" id="editBrotherScore" class="input-name" placeholder="输入新分数">
                <button class="btn-update" onclick="window.updateManualScore('弟弟')">修改</button>
            </div>
        </div>
        
        <div class="admin-section">
            <h3 style="margin-top:0; color:var(--badge-task);">添加新任务 (加分)</h3>
            <div class="admin-row">
                <input type="text" id="taskIcon" class="input-icon" placeholder="图标">
                <input type="text" id="taskName" class="input-name" placeholder="任务名称">
                <input type="number" id="taskPoints" class="input-points" placeholder="分数">
                <button class="btn-add" onclick="window.addItem('tasks')">添加</button>
            </div>
            <div id="adminTaskList"></div>
        </div>

        <div class="admin-section">
            <h3 style="margin-top:0; color:var(--badge-reward);">添加新奖励 (扣分)</h3>
            <div class="admin-row">
                <input type="text" id="rewardIcon" class="input-icon" placeholder="图标">
                <input type="text" id="rewardName" class="input-name" placeholder="奖励名称">
                <input type="number" id="rewardPoints" class="input-points" placeholder="分数">
                <button class="btn-add" onclick="window.addItem('rewards')">添加</button>
            </div>
            <div id="adminRewardList"></div>
        </div>

        <button class="btn-close" onclick="window.closeSettings()">保存并关闭界面</button>
    </div>
</div>

<!-- 引入 Firebase 模块库 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9uo-m9V0mZJyVczJuToccfwjsqpCprh4",
      authDomain: "kids-reward-3b83f.firebaseapp.com",
      databaseURL: "https://kids-reward-3b83f-default-rtdb.firebaseio.com",
      projectId: "kids-reward-3b83f",
      storageBucket: "kids-reward-3b83f.firebasestorage.app",
      messagingSenderId: "386212485697",
      appId: "1:386212485697:web:4d752247be9232b4f0c4c0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, 'kidsRewardsData');

    const defaultData = {
        scores: { "姐姐": { total: 0, today: 0 }, "弟弟": { total: 0, today: 0 } },
        avatars: { "姐姐": "🦄", "弟弟": "🦖" },
        lastDate: new Date().toLocaleDateString(),
        tasks: [
            { id: 1, icon: "🧹", name: "自整理房间", points: 5 },
            { id: 2, icon: "📝", name: "按时完成作业", points: 10 },
            { id: 3, icon: "🧺", name: "帮妈妈做家务", points: 8 },
            { id: 4, icon: "🌙", name: "早睡早起", points: 2 }
        ],
        rewards: [
            { id: 5, icon: "📺", name: "看动画片30分钟", points: 10 },
            { id: 6, icon: "🍦", name: "选一个冰淇淋", points: 15 },
            { id: 7, icon: "🎢", name: "周末去乐园", points: 50 },
            { id: 8, icon: "🧸", name: "新玩具", points: 30 }
        ]
    };

    let appData = null;
    let currentKid = "姐姐";
    let isInitialized = false;
    let editingItemId = null; // 用于跟踪当前正在修改哪个项目
    
    document.getElementById('loadingTip').style.display = 'block';

    onValue(dataRef, (snapshot) => {
        const data = snapshot.val();
        document.getElementById('loadingTip').style.display = 'none';

        if (data) {
            appData = data;
            if(!appData.avatars) appData.avatars = defaultData.avatars;
            if(!appData.tasks) appData.tasks = [];
            if(!appData.rewards) appData.rewards = [];
            isInitialized = true;
            updateUI();
        } else {
            set(dataRef, defaultData);
        }
    });

    function syncDataToCloud() {
        if(isInitialized && appData) set(dataRef, appData);
    }

    function checkDate() {
        if(!appData) return;
        const today = new Date().toLocaleDateString();
        if (appData.lastDate !== today) {
            appData.scores["姐姐"].today = 0;
            appData.scores["弟弟"].today = 0;
            appData.lastDate = today;
            syncDataToCloud();
        }
    }

    window.switchKid = function(kid) {
        currentKid = kid;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (kid === '姐姐') document.querySelector('.tab-sister').classList.add('active');
        if (kid === '弟弟') document.querySelector('.tab-brother').classList.add('active');
        updateUI();
    };

    window.changeScore = function(points, isTask) {
        if(!isInitialized) return;
        if (navigator.vibrate) navigator.vibrate(50);
        
        appData.scores[currentKid].total += points;
        if (appData.scores[currentKid].total < 0) appData.scores[currentKid].total = 0;
        
        if (isTask && points > 0) appData.scores[currentKid].today += points;
        syncDataToCloud();
    };

    window.updateManualScore = function(kid) {
        const inputId = kid === '姐姐' ? 'editSisterScore' : 'editBrotherScore';
        const newScore = parseInt(document.getElementById(inputId).value);
        if (isNaN(newScore) || newScore < 0) return alert("请输入有效的非负数字！");
        
        appData.scores[kid].total = newScore;
        syncDataToCloud();
        
        const btn = document.querySelector(`#${inputId}`).nextElementSibling;
        const originalText = btn.innerText;
        btn.innerText = "已更新✓";
        btn.style.backgroundColor = "#96b4a3";
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = "#e0b084";
        }, 1500);
    };

    function updateUI() {
        if(!appData) return;
        checkDate(); 
        
        document.getElementById('kidName').innerText = currentKid;
        document.getElementById('kidAvatar').innerText = appData.avatars[currentKid];
        document.getElementById('currentScore').innerHTML = `${appData.scores[currentKid].total}<span>分</span>`;
        
        const todayScore = appData.scores[currentKid].today || 0;
        document.getElementById('todayScoreText').innerText = `${todayScore}分`;
        const progressPercent = Math.min((todayScore / 100) * 100, 100);
        document.getElementById('todayProgressBar').style.width = `${progressPercent}%`;
        
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = (appData.tasks || []).map(t => `
            <div class="card" onclick="window.changeScore(${t.points}, true)">
                <div class="card-icon">${t.icon}</div>
                <div class="card-name">${t.name}</div>
                <div class="card-points">(+${t.points} 分)</div>
            </div>
        `).join('');

        const rewardList = document.getElementById('rewardList');
        rewardList.innerHTML = (appData.rewards || []).map(r => `
            <div class="card" onclick="window.changeScore(-${r.points}, false)">
                <div class="card-icon">${r.icon}</div>
                <div class="card-name">${r.name}</div>
                <div class="card-points">(-${r.points} 分)</div>
            </div>
        `).join('');
        
        if (document.getElementById('settingsModal').style.display === 'flex') {
            renderAdminLists();
        }
    }

    window.openSettings = function() {
        if(appData) {
            document.getElementById('editSisterScore').value = appData.scores["姐姐"].total;
            document.getElementById('editBrotherScore').value = appData.scores["弟弟"].total;
        }
        editingItemId = null; // 每次打开设置时重置编辑状态
        document.getElementById('settingsModal').style.display = 'flex';
        renderAdminLists();
    };

    window.closeSettings = function() {
        document.getElementById('settingsModal').style.display = 'none';
        editingItemId = null;
    };

    // ================== 后台列表渲染 (包含修改功能) ==================
    function renderAdminLists() {
        if(!appData) return;

        const renderList = (type, items) => {
            return (items || []).map(item => {
                // 如果当前项目正在被编辑
                if (item.id === editingItemId) {
                    return `
                        <div class="list-item edit-mode">
                            <input type="text" id="editIcon_${item.id}" value="${item.icon}" class="edit-input-icon">
                            <input type="text" id="editName_${item.id}" value="${item.name}" class="edit-input-name">
                            <input type="number" id="editPoints_${item.id}" value="${item.points}" class="edit-input-points">
                            <div>
                                <button class="btn-update" onclick="window.saveEditedItem('${type}', ${item.id})" style="padding: 6px 12px; margin-right: 5px;">保存</button>
                                <button class="btn-del" onclick="window.cancelEdit()" style="background: #a6b6c2;">取消</button>
                            </div>
                        </div>
                    `;
                } 
                // 正常显示模式
                else {
                    return `
                        <div class="list-item">
                            <span>${item.icon} ${item.name} (${type === 'tasks' ? '+' : '-'}${item.points}分)</span>
                            <div>
                                <button class="btn-edit" onclick="window.startEdit(${item.id})">修改</button>
                                <button class="btn-del" onclick="window.deleteItem('${type}', ${item.id})">删除</button>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        };

        document.getElementById('adminTaskList').innerHTML = renderList('tasks', appData.tasks);
        document.getElementById('adminRewardList').innerHTML = renderList('rewards', appData.rewards);
    }

    window.addItem = function(type) {
        const isTask = type === 'tasks';
        const iconInput = document.getElementById(isTask ? 'taskIcon' : 'rewardIcon');
        const nameInput = document.getElementById(isTask ? 'taskName' : 'rewardName');
        const pointsInput = document.getElementById(isTask ? 'taskPoints' : 'rewardPoints');
        
        if (!iconInput.value || !nameInput.value || !pointsInput.value) {
            return alert("请填写图标（输入Emoji即可）、名称和分数！");
        }

        if(!appData[type]) appData[type] = [];
        
        appData[type].push({
            id: Date.now(),
            icon: iconInput.value,
            name: nameInput.value,
            points: parseInt(pointsInput.value)
        });
        
        syncDataToCloud();
        iconInput.value = ''; nameInput.value = ''; pointsInput.value = '';
    };

    window.deleteItem = function(type, id) {
        if(!appData[type]) return;
        appData[type] = appData[type].filter(item => item.id !== id);
        syncDataToCloud();
    };

    // 触发修改模式
    window.startEdit = function(id) {
        editingItemId = id;
        renderAdminLists();
    };

    // 取消修改
    window.cancelEdit = function() {
        editingItemId = null;
        renderAdminLists();
    };

    // 保存修改的内容
    window.saveEditedItem = function(type, id) {
        const newIcon = document.getElementById(`editIcon_${id}`).value;
        const newName = document.getElementById(`editName_${id}`).value;
        const newPoints = parseInt(document.getElementById(`editPoints_${id}`).value);

        if (!newIcon || !newName || isNaN(newPoints)) {
            return alert("图标、名称和分数都不能为空！");
        }

        const itemIndex = appData[type].findIndex(item => item.id === id);
        if (itemIndex !== -1) {
            appData[type][itemIndex] = {
                ...appData[type][itemIndex],
                icon: newIcon,
                name: newName,
                points: newPoints
            };
            
            editingItemId = null; // 退出编辑模式
            syncDataToCloud(); // 同步到云端
        }
    };
</script>

</body>
</html>
